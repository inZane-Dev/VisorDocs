[versions]
# Herramientas de compilacion.
# AGP 8.13.2 es la ultima version de la linea 8.x. Se prefiere sobre AGP 9.x porque
# esta usa un DSL nuevo y Kotlin integrado, lo que exigiria una configuracion distinta.
agp = "8.13.2"
kotlin = "2.2.20"

# Librerias de Android.
activityCompose = "1.13.0"
composeBom = "2026.06.01"
fragmentCompose = "1.8.9"
material = "1.14.0"

# Version fijada a la que ya resolvia el arbol de dependencias de Compose, para no
# introducir un salto de version por la puerta de atras.
lifecycle = "2.9.4"
exifinterface = "1.4.1"

# Port de Apache PDFBox para Android. Es lo que permite unir PDF de verdad, a nivel de
# objetos, conservando texto y calidad. Sin el habria que rasterizar cada pagina.
pdfbox = "2.0.27.0"

# Pruebas.
junit = "4.13.2"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# Visor de PDF oficial de Jetpack. Sigue en alpha: fijar la version exacta.
pdfViewerFragment = "1.0.0-alpha19"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-fragment-compose = { group = "androidx.fragment", name = "fragment-compose", version.ref = "fragmentCompose" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-pdf-viewer-fragment = { group = "androidx.pdf", name = "pdf-viewer-fragment", version.ref = "pdfViewerFragment" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
google-android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
