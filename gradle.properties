# Memoria del demonio de Gradle. Subir si el equipo tiene RAM de sobra.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compilacion en paralelo y cacheada: acelera bastante las recompilaciones.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX es obligatorio para Compose.
android.useAndroidX=true

# Kotlin en modo oficial de estilo de codigo.
kotlin.code.style=official

# Genera solo los recursos R de este modulo, no los de las dependencias.
android.nonTransitiveRClass=true
